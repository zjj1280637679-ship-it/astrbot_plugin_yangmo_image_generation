name: astrbot_plugin_yangmo_image_generation
display_name: "AI 图片与视频生成及原图交付"
desc: "给 AstrBot 主 Agent 增加轻量图片/视频生成 harness：原生 Skill 渐进披露，图片与视频工具可随时调用；引用/回复图片在 refs=current 时优先走 AstrBot 原生 quoted-message 快速解析，失败再保留 Agent 外部解析兜底；配置智谱 Key 后默认优先 CogVideoX-Flash，明确可轮换的创建失败再尝试 Seedance 1.0 Pro；视频时长、画幅、分辨率、尾帧、预告和自动交付默认值可在设置中调整。"
short_desc: "图片 + CogVideoX/Seedance 视频生成，支持引用图快速直达和可配置视频默认值。"
